name: crisisq_device_metrics
description: Current whole-app memory snapshots and OS thermal state for research measurements.
version: 1.0.0
publish_to: none
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: org.crisisq.crisisq_device_metrics
        pluginClass: CrisisqDeviceMetricsPlugin
      ios:
        pluginClass: CrisisqDeviceMetricsPlugin
